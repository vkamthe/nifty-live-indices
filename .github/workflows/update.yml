name: Update NSE Indices Data

on:
  schedule:
    # Runs during NSE trading days Mon-Fri every 5 minutes between 03:45 UTC (09:15 IST) and 10:15 UTC (15:45 IST)
    - cron: "45,50,55 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0,5,10,15 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-nse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest NSE Indices
        run: node fetch.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore(data): auto-update NSE indices snapshot [skip ci]" || echo "No changes to commit"
          git push
