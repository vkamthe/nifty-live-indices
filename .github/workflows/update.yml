name: Update NSE Indices Data

on:
  workflow_dispatch: {} # Manual trigger only — no automated background cron

permissions:
  contents: write

concurrency:
  group: update-nse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest NSE Indices
        run: node fetch.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore(data): auto-update NSE indices snapshot [skip ci]" || echo "No changes to commit"
          git push
